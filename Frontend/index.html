
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Create this</title>
      <meta name="description" content="Simplifies task management by allowing users to quickly create and organize to-do lists, enhancing productivity and workflow efficiency." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var theme = localStorage.getItem("serypart-theme");
            if (theme !== "light" && theme !== "dark") {
              theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
          } catch (e) {}
        })();
      </script>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
      
    </body>
  </html>
